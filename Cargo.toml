[workspace]
resolver = "3"
members = ["crates/core", "crates/api", "crates/cli", "crates/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
resonance-api = { path = "crates/api" }
resonance-core = { path = "crates/core" }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", default-features = false, features = ["aiff", "pcm", "wav"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
debug = "line-tables-only"

[profile.release.package."*"]
debug = false
