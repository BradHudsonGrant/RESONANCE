[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/db",
    "crates/library",
    "crates/engine",
    "crates/jobs",
    "crates/api",
    "crates/cli",
    "crates/fixtures",
    "app",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
resonance-api = { path = "crates/api" }
resonance-core = { path = "crates/core" }
resonance-db = { path = "crates/db" }
resonance-engine = { path = "crates/engine" }
resonance-fixtures = { path = "crates/fixtures" }
resonance-jobs = { path = "crates/jobs" }
resonance-library = { path = "crates/library" }
# Dual-licensed CC0-1.0 OR Apache-2.0; used under Apache-2.0 (ADR 0005).
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
dunce = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
lofty = "0.25.5"
notify = "8.2.2"
rubato = "0.16.2"
rusqlite = { version = "0.42.0", features = ["bundled", "fallible_uint"] }
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", default-features = false, features = [
    "aac",
    "aiff",
    "alac",
    "flac",
    "id3v2",
    "isomp4",
    "mp3",
    "opt-simd",
    "pcm",
    "wav",
] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
debug = "line-tables-only"

[profile.release.package."*"]
debug = false
