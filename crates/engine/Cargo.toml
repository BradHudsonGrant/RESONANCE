[package]
name = "resonance-engine"
description = "Real-time audio: decks, the mixer, the audio clock and the metering tap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
resonance-core.workspace = true
# `realtime` puts the callback thread in the Windows multimedia scheduler.
cpal = { version = "0.18.2", features = ["realtime"] }
rtrb = "0.4.1"
rubato.workspace = true
symphonia.workspace = true

# cpal's WASAPI host opens shared streams at the mixer's period only. These open the device
# directly for exclusive use at a set period; ADR 0015 has the reasons.
[target.'cfg(windows)'.dependencies]
audio_thread_priority = "0.35.1"
wasapi = "0.27.0"

[dev-dependencies]
resonance-fixtures.workspace = true

[lints]
workspace = true
