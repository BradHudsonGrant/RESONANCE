# The changelog is made from the commit history with `just changelog`. Each squash-merged PR is one
# Conventional Commit, so each becomes one line under its kind of change.

[changelog]
header = """
# Changelog

Every release, newest first. Made from the commit history with git-cliff.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}, {{ timestamp | date(format="%-d %B %Y") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/BradHudsonGrant/RESONANCE/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^docs", group = "<!-- 3 -->Docs" },
  { message = "^test", group = "<!-- 4 -->Tests" },
  { message = "^refactor", group = "<!-- 5 -->Code" },
  { message = "^(build|ci|chore)", group = "<!-- 6 -->Build and tooling" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
