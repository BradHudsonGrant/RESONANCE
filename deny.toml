[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    # unicode-ident, which every derive macro pulls in at build time
    "Unicode-3.0",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
