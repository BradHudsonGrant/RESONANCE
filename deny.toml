[graph]
all-features = true
# The desktop targets Resonance ships for. Crates only another target pulls in, such as the
# root certificates rustls-platform-verifier bundles for wasm32, never reach a build.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # target-lexicon's build-time exception grants additional permissions.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    # unicode-ident, which every derive macro pulls in at build time
    "Unicode-3.0",
    # notify and notify-types, the cross-platform filesystem watcher
    "CC0-1.0",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
